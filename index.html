<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Demonlist</title>
    <style>
        body { 
            background-color: #111; 
            color: #fff; 
            font-family: Arial, sans-serif; 
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .level-card { 
            border: 1px solid #444; 
            padding: 15px; 
            margin-bottom: 10px; 
            background: #222; 
        }
        h1 { 
            color: #ff8800; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Demonlist Global</h1>
        <div id="levels-container">Cargando niveles desde Firebase...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <script>
        // 1. Reemplaza estos datos con los de tu proyecto de Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
            projectId: "tu-proyecto"
        };
        
        // 2. Inicializar base de datos
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 3. Leer los niveles y mostrarlos en pantalla
        db.ref('levels').once('value', snapshot => {
            const container = document.getElementById('levels-container');
            container.innerHTML = ""; 
            
            snapshot.forEach(child => {
                let level = child.val();
                container.innerHTML += `
                    <div class="level-card">
                        <h2>#${level.rank} - ${level.name}</h2>
                        <p>Verificador: ${level.firstVictor}</p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
